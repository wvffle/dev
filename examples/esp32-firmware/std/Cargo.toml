[workspace]
# Empty: marks this as its own workspace root rather than attaching to any
# ancestor directory's workspace (this crate targets `xtensa-esp32-espidf`
# via the espup-installed "esp" toolchain, incompatible with any normal
# stable-channel workspace it might otherwise be nested under).

[package]
name = "esp32-firmware-std-example"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "esp32-firmware-std-example"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52", features = ["binstart"] }

[build-dependencies]
embuild = "0.33"
